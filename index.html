<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zindress</title>

<style>
:root{
  --cherry:#c21833;
  --soft:#fff5f7;
}

/* 🔴 พื้นหลังแดงเชอร์รี่ */
body{
  margin:0;
  font-family:"Sarabun",sans-serif;
  background:linear-gradient(135deg,#58121e,#8e1026);
  color:#333;
}

/* Header */
.header{
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:bold;
  color:white;
  animation:fadeDown 0.8s ease;
}

/* 📅 กล่องวันที่แบบพรีเมียม */
.today-box{
  background:linear-gradient(135deg,#ffffff,#fff0f3);
  margin:14px;
  padding:16px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,0.18);
  animation:fadeUp 0.8s ease;
  position:relative;
  overflow:hidden;
}



/* ไอคอนปฏิทิน */
.today-icon{
  font-size:22px;
  margin-bottom:4px;
}

/* ตัวเลขวันใหญ่ */
.today-day{
  font-size:28px;
  font-weight:bold;
  color:var(--cherry);
  line-height:1;
}

/* เดือนและปี */
.today-month{
  font-size:14px;
  color:#555;
}
/* container */
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
  padding:12px;
}

/* card */
.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 6px 14px rgba(0,0,0,0.2);
  animation:fadeUp 0.8s ease;
  transition:transform 0.25s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  aspect-ratio:1/1;   /* ทำให้เป็นสี่เหลี่ยมจัตุรัส */
  object-fit:cover;   /* ครอปภาพให้เต็มโดยไม่เสียสัดส่วน */
}

.card-body{
  padding:12px;
  text-align:center;
}

.card h3{
  margin:0 0 10px;
  color:var(--cherry);
  font-size:16px;
}

/* status */
.status-btn{
  padding:10px;
  border-radius:8px;
  font-weight:bold;
  color:white;
}

.available{ background:#28a745; }
.rented{ background:#c21833; }

/* footer */
.footer{
  text-align:center;
  color:white;
  font-size:13px;
  padding:16px;
  opacity:0.9;
  animation:fadeUp 1s ease;
}

/* 🔳 ฉากหลัง popup */
.modal{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.45);
  justify-content:center;
  align-items:center;
  z-index:999;
}

/* 🪟 กล่อง */
.modal-content{
  background:white;
  padding:20px;
  border-radius:16px;
  text-align:center;
  width:85%;
  max-width:320px;
  animation:zoomIn 0.25s ease;
}

.modal-content h3{
  color:#c21833;
}

.modal-btn{
  display:block;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
}

/* 🔴 ปุ่มลอยด้านล่าง */
.floating-book{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,#ff4d6d,#c21833);
  color:white;
  border:none;
  padding:14px 26px;
  border-radius:30px;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 6px 18px rgba(194,24,51,0.45);
  z-index:999;
  animation:pulse 1.8s infinite;
}

.close-modal{
  background:#eee;
  display:block;
  margin:12px auto 0; /* 👈 ทำให้อยู่กลาง */
  width:60%;
  text-align:center;
}

/* ✨ เต้นเบา ๆ */
@keyframes pulse{
  0%{ transform:translateX(-50%) scale(1); }
  50%{ transform:translateX(-50%) scale(1.05); }
  100%{ transform:translateX(-50%) scale(1); }
}

.go-ig{ background:#c21833; color:white; }
.close-modal{ background:#eee; }

/* ✨ Animation */
@keyframes zoomIn{
  from{transform:scale(0.8); opacity:0;}
  to{transform:scale(1); opacity:1;}
}

/* ✨ Animation */
@keyframes fadeUp{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes fadeDown{
  from{opacity:0; transform:translateY(-20px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>
<body>

<div class="header">zindress - เช่าชุดมมส <br> เริ่มต้น29บาท</div>

<div class="today-box">
  <div class="today-icon"> วันนี้</div>
  <div class="today-day" id="todayDay"></div>
  <div class="today-month" id="todayMonth"></div>
</div>


<!-- เฉพาะส่วน container -->
<div class="container">

  <!-- ตัวอย่างชุด -->
  <div class="card"><img src="images/3.png"><div class="card-body"><h3>D01</h3><div id="status1" class="status-btn"></div></div></div>
  <div class="card"><img src="images/4.png"><div class="card-body"><h3>W01</h3><div id="status2" class="status-btn"></div></div></div>
  <div class="card"><img src="images/5.png"><div class="card-body"><h3>B01</h3><div id="status3" class="status-btn"></div></div></div>
  <div class="card"><img src="images/6.png"><div class="card-body"><h3>W02</h3><div id="status4" class="status-btn"></div></div></div>
  <div class="card"><img src="images/7.png"><div class="card-body"><h3>B02</h3><div id="status5" class="status-btn"></div></div></div>
  <div class="card"><img src="images/8.png"><div class="card-body"><h3>W03</h3><div id="status6" class="status-btn"></div></div></div>
  <div class="card"><img src="images/9.png"><div class="card-body"><h3>W04</h3><div id="status7" class="status-btn"></div></div></div>
  <div class="card"><img src="images/10.png"><div class="card-body"><h3>W05</h3><div id="status8" class="status-btn"></div></div></div>
  <div class="card"><img src="images/11.png"><div class="card-body"><h3>W06</h3><div id="status9" class="status-btn"></div></div></div>
  <div class="card"><img src="images/12.png"><div class="card-body"><h3>W07</h3><div id="status10" class="status-btn"></div></div></div>
  <div class="card"><img src="images/13.png"><div class="card-body"><h3>W08</h3><div id="status11" class="status-btn"></div></div></div>
  <div class="card"><img src="images/14.png"><div class="card-body"><h3>W09</h3><div id="status12" class="status-btn"></div></div></div>
  <div class="card"><img src="images/15.png"><div class="card-body"><h3>W10</h3><div id="status13" class="status-btn"></div></div></div>
  <div class="card"><img src="images/16.png"><div class="card-body"><h3>P01</h3><div id="status14" class="status-btn"></div></div></div>

</div>

<!-- 🔴 ปุ่มจองลอย -->
<button class="floating-book" onclick="openModal()">
  จองชุด / ติดต่อร้าน
</button>

<!-- 🔳 Popup -->
<div id="bookingModal" class="modal">
  <div class="modal-content">
    <h3>จองชุด</h3>
    <p>ติดต่อร้านเพื่อจองชุดผ่าน Instagram</p>

    <a href="https://www.instagram.com/zindress.01/" target="_blank" class="modal-btn go-ig">
      ไปที่ Instagram ร้าน
    </a>

    <button class="modal-btn close-modal" onclick="closeModal()">ปิด</button>
  </div>
</div>

<script>
// 📅 แสดงวันที่วันนี้
// 📅 วันที่สวย ๆ แบบแยกส่วน
const today = new Date();

const day = today.getDate();
const monthYear = today.toLocaleDateString('th-TH', {
  month: 'long',
  year: 'numeric'
});

document.getElementById("todayDay").innerHTML = day;
document.getElementById("todayMonth").innerHTML = monthYear;

// 🔧 แอดมินแก้สถานะรายวันตรงนี้
const todayStatus = {
  1: "vailable",
  2: "rented",
  3: "available",
  4: "rented",
  5: "available",
  6: "rented",
  7: "rented",
  8: "available",
  9: "available",
  10: "available",
  11: "available",
  12: "available",
  13: "rented",
  14: "rented",
};


for(let id in todayStatus){
  const el = document.getElementById("status"+id);

  if(todayStatus[id] === "rented"){
    el.innerHTML = " ถูกเช่าแล้ววันนี้";
    el.classList.add("rented");
  }else{
    el.innerHTML = " ว่างวันนี้";
    el.classList.add("available");
  }
}



</script>
<script>
function openModal(){
  document.getElementById("bookingModal").style.display = "flex";
}

function closeModal(){
  document.getElementById("bookingModal").style.display = "none";
}
</script>

</body>
</html>
